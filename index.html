<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドローンモニター</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>ドローンモニター</h1>
    <hr>
    <!-- 左側：送信パネル -->
    <div class="field">
        <div class="panel">
            <h2>① 送信側 (スロットル)</h2>
            
            <div class="btn-group">
                <button id="connectBtn">接続</button>
                <button id="disconnectBtn" disabled>切断</button>
            </div>
            <div id="status">ステータス: 未接続</div>

            <!-- 一括制御用スライダー -->
            <div class="slider-container all-control">
                <label for="sliderAll" style="color: #0050b3;">モーター ALL:</label>
                <input type="range" id="sliderAll" min="48" max="2047" value="48">
                <span id="valAll" class="value-display" style="color: #0050b3;">48 (0x030)</span>
            </div>

            <!-- 個別スライダー 4本 -->
            <div class="slider-container">
                <label for="slider0">モーター 1:</label>
                <input type="range" id="slider0" min="48" max="2047" value="48">
                <span id="val0" class="value-display">48 (0x030)</span>
            </div>

            <div class="slider-container">
                <label for="slider1">モーター 2:</label>
                <input type="range" id="slider1" min="48" max="2047" value="48">
                <span id="val1" class="value-display">48 (0x030)</span>
            </div>

            <div class="slider-container">
                <label for="slider2">モーター 3:</label>
                <input type="range" id="slider2" min="48" max="2047" value="48">
                <span id="val2" class="value-display">48 (0x030)</span>
            </div>

            <div class="slider-container">
                <label for="slider3">モーター 4:</label>
                <input type="range" id="slider3" min="48" max="2047" value="48">
                <span id="val3" class="value-display">48 (0x030)</span>
            </div>
            <div class="btn-group">
                <button id="zeroBtn" style="margin-top: 10px; padding: 5px;">0を送信</button>
                <button id="fortyEightBtn" style="margin-top: 10px; padding: 5px;">48を送信</button>
            </div>
        </div>

        <!-- 右側：受信パネル -->
        <div class="panel">
            <h2>② 受信側 (Hex表示)</h2>
            <p style="font-size: 13px; color: #666;">マイコン（ESP32-S3）から復元されて返ってきた4つのデータをHexで表示します。</p>
            <textarea id="outputArea" readonly placeholder="データを受信するとHex表示されます..."></textarea>
            <button id="clearBtn" style="margin-top: 10px; padding: 5px;">ログをクリア</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
